name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # The server runs watchtower, which polls GHCR and pulls/restarts the
    # bot on its own - this workflow only needs to publish the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdf-to-anki:latest
            ghcr.io/${{ github.repository_owner }}/pdf-to-anki:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
