[project]
name = "pdf-to-anki"
version = "0.1.0"
description = "Convert color-marked PDF study material into Anki decks"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "genanki>=0.13",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "python-telegram-bot>=21",
    "boto3>=1.34",
]

[project.scripts]
pdf-to-anki = "pdf_to_anki.cli:main"
pdf-to-anki-bot = "pdf_to_anki.bot.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_anki"]
